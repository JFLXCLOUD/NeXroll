name: Build and Attach Jellyfin Plugins

# Builds separate NeXroll Intros packages for Jellyfin 10.11 and Jellyfin 12.
# Each install zip (DLL + meta.json + thumb.png) is attached to the matching
# GitHub release, so users always have a ready download for the current plugin
# instead of building it themselves.
#
# Triggered on tag push (not `release: published`) on purpose: release-triggered
# workflows only run from the default branch, but releases here are tagged from
# the active feature branch. A tag-push workflow runs from the tagged commit, so
# it works regardless of which branch the release came from. It waits for the
# GitHub release to exist before uploading (the release is created moments after
# the tag is pushed).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the plugin to (e.g. v2.0.0-beta.13)'
        required: true

# Least privilege by default; jobs that publish declare more.
permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - directory: NeXroll.Jellyfin
            sdk: '9.0.x'
          - directory: NeXroll.Jellyfin12
            sdk: '10.0.x'
    permissions:
      contents: write   # required to upload release assets
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Build + package plugin
        shell: pwsh
        working-directory: Plugins/${{ matrix.directory }}
        run: ./package.ps1

      - name: Resolve package filename
        id: package
        shell: pwsh
        env:
          PLUGIN_DIRECTORY: ${{ matrix.directory }}
        run: |
          $root = "Plugins/$env:PLUGIN_DIRECTORY"
          $version = (Get-Content "$root/meta.json" -Raw | ConvertFrom-Json).version
          $zip = "$root/$env:PLUGIN_DIRECTORY-$version.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Missing package: $zip" }
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          fi
        env:
          REQUESTED_TAG: ${{ inputs.tag }}

      - name: Attach plugin zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_ZIP: ${{ steps.package.outputs.zip }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          zip="$PLUGIN_ZIP"
          tag="$RELEASE_TAG"
          for i in 1 2 3 4 5 6; do
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$zip")"; then
                echo "Preserving existing release asset $zip"; exit 0
              fi
              gh release upload "$tag" "$zip"
              echo "Uploaded $zip to $tag"; exit 0
            fi
            echo "Release $tag not published yet, waiting 10s ($i/6)…"; sleep 10
          done
          echo "Release $tag never appeared — create the GitHub release for this tag, then re-run."; exit 1

  publish-repository:
    needs: build-plugin
    runs-on: ubuntu-latest
    concurrency:
      group: jellyfin-plugin-catalog
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Publish verified catalog packages and manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python -m unittest discover -s Plugins/jellyfin -p test_repository.py
          python Plugins/jellyfin/update_repository.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Commit catalog updates
        run: |
          git add Plugins/jellyfin/manifest*.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Jellyfin plugin catalogs"
          git pull --rebase origin main
          git push origin HEAD:main
