name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.10.14)'
        required: true
        default: ''

env:
  REGISTRY: docker.io
  IMAGE_NAME: jbrns/nexroll
  GHCR_IMAGE: ghcr.io/jflxcloud/nexroll
  # GitHub forces Node 24 for JS actions from 2026-06-16; opt in now so the
  # switch is validated on our schedule. Safe to delete after 2026-09-16
  # (Node 20 removed from runners entirely).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Shared with docker-refresh.yml's scheduled tag refresh — without this, a
# real release push and a scheduled refresh could race a multi-arch
# `buildx --push` on the same floating tag and produce a broken manifest list.
concurrency:
  group: docker-image-push
  cancel-in-progress: false

# Least privilege by default; jobs that publish declare more.
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            # Check if version contains beta/rc/alpha
            if [[ "$VERSION" =~ (beta|rc|alpha) ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          # Remove 'v' prefix for Docker tag
          VERSION_NUM="${VERSION#v}"
          echo "version=${VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_NUM}"
          echo "Is Pre-release: ${IS_PRERELEASE}"

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The release's own code. Without a ref, a manual run built the
          # branch it was started from and labelled it with this version.
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: NeXroll/frontend/package-lock.json

      - name: Build frontend
        working-directory: NeXroll/frontend
        env:
          CI: false
        run: |
          npm ci
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GHCR as well as Docker Hub: Docker Hub rate-limits pulls, and GHCR
      # images link back to this repo. Publishing there stopped in October 2025
      # (15bc1bd) and its :latest was left at 1.5.12.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: docker_tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IS_PRERELEASE="${{ steps.version.outputs.is_prerelease }}"

          # The floating tags (latest, beta, 2.2, 2) only move to the newest
          # version they cover, so rebuilding an older release by hand can't
          # roll them back. Published release versions, without the v:
          gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isDraft == false) | "\(.isPrerelease) \(.tagName | ltrimstr("v"))"' > releases.txt
          STABLE=$(awk '$1 == "false" { print $2 }' releases.txt)
          PRERELEASES=$(awk '$1 == "true" { print $2 }' releases.txt)

          # The highest of the versions on stdin, one per line.
          highest() { awk NF | sort -V | tail -n 1; }
          # The highest stable version starting with $1, counting this one.
          newest_stable() {
            printf '%s\n%s\n' "$VERSION" "$STABLE" | awk -v p="$1" 'substr($0, 1, length(p)) == p' | highest
          }

          FLOATING=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            # :beta is the newest prerelease, while it is for a later version
            # than the newest stable release.
            NEWEST_STABLE=$(echo "$STABLE" | highest)
            if [ "$(printf '%s\n%s\n' "$VERSION" "$PRERELEASES" | highest)" = "$VERSION" ] &&
               [ "$(printf '%s\n%s\n' "${VERSION%%-*}" "$NEWEST_STABLE" | highest)" != "$NEWEST_STABLE" ]; then
              FLOATING="beta"
            fi
          else
            if [ "$(newest_stable "")" = "$VERSION" ]; then
              FLOATING="latest"
              # :beta follows the stable release too, unless a beta for a
              # later version is out (the weekly refresh uses the same rule).
              NEWEST_BETA=$(echo "$PRERELEASES" | sed 's/-.*//' | highest)
              if [ -z "$NEWEST_BETA" ] || [ "$(printf '%s\n%s\n' "$NEWEST_BETA" "$VERSION" | highest)" = "$VERSION" ]; then
                FLOATING="$FLOATING beta"
              fi
            fi
            # :2.2 and :2, for people who pin to a minor or major version.
            if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="$MAJOR.${BASH_REMATCH[2]}"
              if [ "$(newest_stable "$MINOR.")" = "$VERSION" ]; then FLOATING="$FLOATING $MINOR"; fi
              if [ "$(newest_stable "$MAJOR.")" = "$VERSION" ]; then FLOATING="$FLOATING $MAJOR"; fi
            fi
          fi

          TAGS="${IMAGE_NAME}:${VERSION},${GHCR_IMAGE}:${VERSION}"
          for tag in $FLOATING; do
            TAGS="${TAGS},${IMAGE_NAME}:${tag},${GHCR_IMAGE}:${tag}"
          done
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Using tags: ${VERSION} ${FLOATING}"

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
