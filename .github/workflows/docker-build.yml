name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.10.14)'
        required: true
        default: ''

env:
  REGISTRY: docker.io
  IMAGE_NAME: jbrns/nexroll
  GHCR_IMAGE: ghcr.io/jflxcloud/nexroll

# Shared with docker-refresh.yml's scheduled tag refresh — without this, a
# real release push and a scheduled refresh could race a multi-arch
# `buildx --push` on the same floating tag and produce a broken manifest list.
concurrency:
  group: docker-image-push
  cancel-in-progress: false

# Least privilege by default; jobs that publish declare more.
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            # Check if version contains beta/rc/alpha
            if [[ "$VERSION" =~ (beta|rc|alpha) ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          # Remove 'v' prefix for Docker tag
          VERSION_NUM="${VERSION#v}"
          echo "version=${VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_NUM}"
          echo "Is Pre-release: ${IS_PRERELEASE}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release's own code. Without a ref, a manual run built the
          # branch it was started from and labelled it with this version.
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: NeXroll/frontend/package-lock.json

      - name: Build frontend
        working-directory: NeXroll/frontend
        env:
          CI: false
        run: |
          npm ci
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GHCR as well as Docker Hub: Docker Hub rate-limits pulls, and GHCR
      # images link back to this repo. Publishing there stopped in October 2025
      # (15bc1bd) and its :latest was left at 1.5.12.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: docker_tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IS_PRERELEASE="${{ steps.version.outputs.is_prerelease }}"

          # The floating tags (latest, beta, 2.2, 2) only move to the newest
          # version they cover, so rebuilding an older release by hand can't
          # roll them back. Published release versions, without the v:
          gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isDraft == false) | "\(.isPrerelease) \(.tagName | ltrimstr("v"))"' > releases.txt
          STABLE=$(awk '$1 == "false" { print $2 }' releases.txt)
          PRERELEASES=$(awk '$1 == "true" { print $2 }' releases.txt)

          # The highest of the versions on stdin, one per line.
          highest() { awk NF | sort -V | tail -n 1; }
          # The highest stable version starting with $1, counting this one.
          newest_stable() {
            printf '%s\n%s\n' "$VERSION" "$STABLE" | awk -v p="$1" 'substr($0, 1, length(p)) == p' | highest
          }

          FLOATING=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            # :beta is the newest prerelease, while it is for a later version
            # than the newest stable release.
            NEWEST_STABLE=$(echo "$STABLE" | highest)
            if [ "$(printf '%s\n%s\n' "$VERSION" "$PRERELEASES" | highest)" = "$VERSION" ] &&
               [ "$(printf '%s\n%s\n' "${VERSION%%-*}" "$NEWEST_STABLE" | highest)" != "$NEWEST_STABLE" ]; then
              FLOATING="beta"
            fi
          else
            if [ "$(newest_stable "")" = "$VERSION" ]; then
              FLOATING="latest"
              # :beta follows the stable release too, unless a beta for a
              # later version is out (the weekly refresh uses the same rule).
              NEWEST_BETA=$(echo "$PRERELEASES" | sed 's/-.*//' | highest)
              if [ -z "$NEWEST_BETA" ] || [ "$(printf '%s\n%s\n' "$NEWEST_BETA" "$VERSION" | highest)" = "$VERSION" ]; then
                FLOATING="$FLOATING beta"
              fi
            fi
            # :2.2 and :2, for people who pin to a minor or major version.
            if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="$MAJOR.${BASH_REMATCH[2]}"
              if [ "$(newest_stable "$MINOR.")" = "$VERSION" ]; then FLOATING="$FLOATING $MINOR"; fi
              if [ "$(newest_stable "$MAJOR.")" = "$VERSION" ]; then FLOATING="$FLOATING $MAJOR"; fi
            fi
          fi

          TAGS="${IMAGE_NAME}:${VERSION},${GHCR_IMAGE}:${VERSION}"
          for tag in $FLOATING; do
            TAGS="${TAGS},${IMAGE_NAME}:${tag},${GHCR_IMAGE}:${tag}"
          done
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Using tags: ${VERSION} ${FLOATING}"

      # Nothing is pushed until the release's backend tests pass inside the
      # amd64 image (the same step as docker-ci.yml): packages resolve at build
      # time from minimums in requirements.txt. The push below reuses its layers.
      # Unchanged layers (apt, pip) come from the cache, which the weekly
      # refresh rebuilds from scratch, so they are at most about a week old.
      - name: Build the amd64 image for the tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: nexroll:test
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Backend tests in the image
        run: |
          python -m pip install --quiet --target "$RUNNER_TEMP/pytest" pytest
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/pytest:/opt/pytest:ro" \
            -e PYTHONPATH=/opt/pytest -w /src/NeXroll \
            nexroll:test python -m pytest -q -p no:cacheprovider tests

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
