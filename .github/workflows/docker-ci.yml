name: Docker image

# Builds the image on PRs that touch how it is built. docker-build.yml only
# runs on a published release, so until now nothing exercised the Dockerfile
# before it shipped -- a change could be merged, tagged, and only fail when the
# release build ran. Deliberately amd64-only and never pushed: the release
# workflow still does the full multi-arch push.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege by default; jobs that publish declare more.
permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Loaded into the local daemon so the checks below can run it.
          load: true
          tags: nexroll:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile installs from pre-built wheels with --no-index, so a
      # missing or misnamed requirement fails at import rather than at build.
      # segno backs the QR templates and Pillow the themed backdrops; both are
      # imported lazily at render time, so nothing else would catch their
      # absence until someone tried to generate a preroll.
      - name: Runtime imports resolve
        run: |
          docker run --rm nexroll:ci python -c "
          import fastapi, uvicorn, sqlalchemy, lxml, plexapi, yt_dlp, segno
          from PIL import Image, ImageDraw, ImageFilter
          print('imports ok')
          "

      # yt-dlp needs Deno for YouTube; it comes from Deno's binary image.
      - name: Deno runs
        run: docker run --rm nexroll:ci deno --version

      - name: Backend starts and answers /health
        run: |
          docker run -d --name nexroll-ci -p 9393:9393 nexroll:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9393/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"; docker rm -f nexroll-ci; exit 0
            fi
            sleep 1
          done
          echo "::error::Container never answered /health"
          docker logs nexroll-ci
          docker rm -f nexroll-ci
          exit 1

      # NeXroll runs as root unless NEXROLL_RUN_AS_PUID is set; with it, as
      # PUID:PGID, after the entrypoint hands over the files it made as root.
      # Upgrade path: the same volume, first written as root, then opted in.
      - name: Runs as root by default, as PUID:PGID when asked
        run: |
          wait_healthy() {
            for _ in $(seq 1 40); do
              docker exec "$1" curl -fsS http://localhost:9393/health > /dev/null 2>&1 && return 0
              sleep 1
            done
            echo "::error::$1 never answered /health"; docker logs "$1"; return 1
          }
          pid1_uid() { docker exec "$1" sh -c "awk '/^Uid:/{print \$2}' /proc/1/status"; }
          docker volume create nx-ci-data > /dev/null
          docker run -d --name nx-root -v nx-ci-data:/data nexroll:ci > /dev/null
          wait_healthy nx-root
          root_uid=$(pid1_uid nx-root)
          docker rm -f nx-root > /dev/null
          docker run -d --name nx-puid -v nx-ci-data:/data \
            -e NEXROLL_RUN_AS_PUID=true -e PUID=1234 -e PGID=1235 nexroll:ci > /dev/null
          wait_healthy nx-puid
          puid_uid=$(pid1_uid nx-puid)
          db_owner=$(docker exec nx-puid stat -c %u:%g /data/nexroll.db)
          root_left=$(docker exec nx-puid find /data -user 0 | head -5)
          docker logs nx-puid 2>&1 | grep "NeXroll:" || true
          docker rm -f nx-puid > /dev/null; docker volume rm nx-ci-data > /dev/null
          echo "default uid $root_uid; opted in uid $puid_uid, nexroll.db $db_owner"
          [ "$root_uid" = 0 ] || { echo "::error::default run is not root"; exit 1; }
          [ "$puid_uid" = 1234 ] || { echo "::error::opted-in run is not uid 1234"; exit 1; }
          [ "$db_owner" = 1234:1235 ] || { echo "::error::nexroll.db not handed over"; exit 1; }
          [ -z "$root_left" ] || { echo "::error::root-owned files left in /data: $root_left"; exit 1; }

      # The provider's dev dependencies are pruned after it is compiled; this
      # catches a prune that took something the server needs at runtime (the
      # native canvas module included). 2.0.0 must answer on loopback only.
      - name: PO-token provider starts
        run: |
          docker run --rm nexroll:ci sh -c '
            node /opt/bgutil-provider/server/build/main.js --port 4416 > /tmp/pot.log 2>&1 &
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:4416/ping; then echo; exit 0; fi
              sleep 1
            done
            cat /tmp/pot.log; exit 1'

      # These carried every "fixable" finding on the 2.2.0 image: pip's vendored
      # setuptools/msgpack, and the provider's build tools (eslint, typescript
      # and their dependencies). Keep them out.
      - name: No pip or provider build tools in the image
        run: |
          docker run --rm nexroll:ci sh -c '
            if python -c "import pip" 2>/dev/null; then echo "::error::pip is installed"; exit 1; fi
            for pkg in typescript eslint prettier; do
              if [ -d /opt/bgutil-provider/server/node_modules/$pkg ]; then echo "::error::$pkg shipped"; exit 1; fi
            done
            echo "pip and provider build tools absent"'

      # A COPY of the build-only wheel directory cannot be undone by a later
      # `rm -rf`: the layer is already committed, so the bytes ship in every
      # pull. Bind-mount them into the RUN instead.
      - name: No build-only wheels committed to a layer
        run: |
          if docker history --no-trunc --format '{{.CreatedBy}}' nexroll:ci | grep -qE 'COPY .*/wheels'; then
            echo "::error::A COPY of /wheels is committed to a layer. Its bytes ship in every pull even if a later RUN deletes them. Use RUN --mount=type=bind,from=builder,source=/wheels,target=/wheels instead."
            docker history nexroll:ci
            exit 1
          fi
          echo "no committed wheels layer"

      - name: Report image size
        run: |
          size=$(docker image inspect nexroll:ci --format '{{.Size}}')
          echo "Image size: $(numfmt --to=iec --suffix=B "$size")" >> "$GITHUB_STEP_SUMMARY"
          docker history nexroll:ci >> "$GITHUB_STEP_SUMMARY"
