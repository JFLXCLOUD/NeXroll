name: Copy Docker Hub tags to GHCR

# Copies already-published images from Docker Hub to GHCR unchanged (same
# manifests and digests, nothing rebuilt), for tags released while GHCR
# publishing was off. New releases and the weekly refresh push to both
# registries themselves (docker-build.yml, docker-refresh.yml).
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags to copy, space-separated (e.g. "2.2.3 latest")'
        required: true
        default: 'latest'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: jbrns/nexroll
  GHCR_IMAGE: ghcr.io/jflxcloud/nexroll

concurrency:
  group: docker-image-push
  cancel-in-progress: false

# Least privilege by default; jobs that publish declare more.
permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy tags
        env:
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            echo "Copying ${IMAGE_NAME}:${tag} -> ${GHCR_IMAGE}:${tag}"
            docker buildx imagetools create --tag "${GHCR_IMAGE}:${tag}" "docker.io/${IMAGE_NAME}:${tag}"
            # Not piped into head: with pipefail, the closed pipe fails the step.
            docker buildx imagetools inspect "${GHCR_IMAGE}:${tag}" > inspect.txt
            head -n 3 inspect.txt
          done
