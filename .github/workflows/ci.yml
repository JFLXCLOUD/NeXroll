name: CI

# Every push to main and every pull request: the frontend tests and build, and
# the backend tests on Linux and Windows with the Python NeXroll ships (3.14 in
# both the Docker image and the Windows installer), plus Linux with an older
# Python for people who run it from source. requirements.txt sets only
# minimums, so the newest releases are installed and a breaking one fails
# here. The Docker workflows run the backend tests again inside the image
# before they push it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that publish declare more.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NeXroll/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: NeXroll/frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: CI=true npx react-scripts test --watchAll=false
      # CI=false: CRA treats warnings as errors under CI=true; we gate on real
      # build failures only (matches the local build command).
      - run: CI=false npm run build

  backend:
    name: Backend tests (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Docker, Linux + Python 3.14
            os: ubuntu-latest
            python: "3.14"
            extra: ""
          # The installer's build environment also has pywin32 (Windows
          # Credential Manager for the secure store).
          - label: installer, Windows + Python 3.14
            os: windows-latest
            python: "3.14"
            extra: pywin32
          # The Docker image ran 3.12 until 2.5.2; kept so source installs on
          # an older Python stay covered.
          - label: source installs, Linux + Python 3.12
            os: ubuntu-latest
            python: "3.12"
            extra: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all backend sources
        run: python -m compileall -q NeXroll/backend NeXroll/version.py NeXroll/scripts
      - name: Install requirements
        run: python -m pip install -r requirements.txt pytest ${{ matrix.extra }}
      - name: Tests
        working-directory: NeXroll
        run: python -m pytest -q -p no:cacheprovider tests
